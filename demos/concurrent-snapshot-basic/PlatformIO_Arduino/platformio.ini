[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17

lib_deps =
    EDP-Platform=symlink://../../..
    EDP-System=https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    EDP-Platform-Arduino=https://github.com/ESPressio-Development-Platform/EDP-Platform-Arduino.git#main
